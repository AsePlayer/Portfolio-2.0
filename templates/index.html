<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="index,follow">
  <meta id="theme-color" name="theme-color" content="#14213d">

  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('portfolio-theme');
        var systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = savedTheme || systemTheme;
      } catch (error) {
        document.documentElement.dataset.theme = 'light';
      }
    }());
  </script>

  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  {{metadata}}
  <link rel="stylesheet" href="css/styles.css">

</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="#home" aria-label="Ryan Scott home">
        <span class="logo-mark" data-site-initials>{{initials}}</span>
        <span data-site-name>{{name}}</span>
      </a>

      <div class="header-actions">
        <nav id="primary-nav" class="primary-nav" aria-label="Primary navigation">
          <ul data-nav>{{navigation}}</ul>
        </nav>

        <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode" title="Switch to dark mode">
          <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.4 15.2A8.5 8.5 0 0 1 8.8 3.6 8.5 8.5 0 1 0 20.4 15.2Z"/>
          </svg>
          <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3.5"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
        </button>

        <button id="nav-toggle" class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Open navigation">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </header>

  <main id="main" data-page tabindex="-1">
    {{content}}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; <span id="year">{{year}}</span> <span data-footer-name>{{name}}</span>. {{footer}}</p>
      <a href="#home">Back to top</a>
    </div>
  </footer>

  <script src="js/script.js" defer></script>
</body>
</html>
