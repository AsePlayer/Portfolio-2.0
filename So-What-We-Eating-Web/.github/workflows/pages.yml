name: Deploy GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: swwe-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ vars.APP_DIRECTORY || '.' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm run verify
        env:
          VITE_RESTAURANT_PROXY_URL: ${{ vars.VITE_RESTAURANT_PROXY_URL }}
          VITE_RESTAURANT_PROVIDER: ${{ vars.VITE_RESTAURANT_PROVIDER || 'openstreetmap' }}
          VITE_DISCOVERY_MODE: live
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ vars.APP_DIRECTORY && format('{0}/dist', vars.APP_DIRECTORY) || 'dist' }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
