name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Fetch the app after its 16:17 UTC catalog update, when configured.
    - cron: '17 17 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'schedule' || vars.STRETCH_FINDER_REPOSITORY != ''
    environment:
      name: github-pages
      url: https://ryanscott.org/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Checkout stretch finder source
        if: vars.STRETCH_FINDER_REPOSITORY != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ vars.STRETCH_FINDER_REPOSITORY }}
          path: .tmp/stretch-finder-source
          persist-credentials: false

      - name: Build latest stretch finder into the portfolio
        if: vars.STRETCH_FINDER_REPOSITORY != ''
        working-directory: .tmp/stretch-finder-source
        run: |
          npm ci
          npm run portfolio:sync -- --portfolio "$GITHUB_WORKSPACE"

      - name: Validate portfolio content and assets
        run: |
          node --check js/script.js
          node --check scripts/serve.mjs
          node --check scripts/validate-site.mjs
          node --check scripts/build.mjs
          node --check scripts/render-site.mjs
          node --check scripts/validate-content.mjs
          node --test scripts/site.test.mjs
          node scripts/build.mjs
          node scripts/validate-site.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
